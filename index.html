<html lang="en">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f7f4" />
    <meta name="mobile-web-app-capable" content="yes" />

    <script>
      try {
        const theme = localStorage.getItem('plutonea.theme');
        document.documentElement.dataset.theme = ['grove', 'sunrise', 'lagoon'].includes(theme) ? theme : 'grove';
      } catch { document.documentElement.dataset.theme = 'grove'; }
    </script>
